<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hoja de Palets - framajova</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#e0e0e0; --white:#fff; --panel:#f5f5f5;
  --border:#ddd; --border-dark:#bbb;
  --text:#1a1a1a; --muted:#666; --light:#999;
  --accent:#1a1a1a; --green:#1e7e34; --red:#c0392b;
  --radius:6px; --shadow:0 2px 12px rgba(0,0,0,0.12);
}

html, body { height:100%; overflow:hidden; }
body { background:var(--bg); font-family:Arial,Helvetica,sans-serif; font-size:14px; color:var(--text); display:flex; flex-direction:column; }

/* NAV */
nav { background:var(--accent); color:white; display:flex; align-items:center; padding:0 20px; height:48px; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
.nav-logo { font-size:14px; font-weight:bold; letter-spacing:1px; margin-right:28px; }
.nav-logo span { opacity:.4; }
.nav-tab { height:48px; padding:0 18px; display:flex; align-items:center; gap:7px; font-size:13px; font-weight:bold; cursor:pointer; border-bottom:3px solid transparent; color:rgba(255,255,255,.6); user-select:none; }
.nav-tab:hover { color:white; background:rgba(255,255,255,.07); }
.nav-tab.active { color:white; border-bottom-color:white; }

/* PAGES */
.page { display:none; flex:1; min-height:0; overflow:hidden; }
.page.visible { display:flex; flex-direction:column; }

/* ---- ETIQUETAS PAGE ---- */
.etq-top { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; flex-shrink:0; border-bottom:1px solid var(--border); background:var(--white); }
.etq-top-title { font-size:15px; font-weight:bold; }
.etq-top-sub { font-size:12px; color:var(--muted); }
.etq-body { flex:1; min-height:0; display:grid; grid-template-columns:310px 1fr; }

/* CONFIG COL */
.config-col { border-right:1px solid var(--border); overflow-y:auto; background:var(--white); display:flex; flex-direction:column; }
.config-section { border-bottom:1px solid var(--border); padding:12px 14px; }
.config-section-title { font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:8px; }

/* PREVIEW COL — clave: usa zoom para escalar sin JS */
.preview-col {
  background:#555;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.preview-zoom-wrap {
  /* zoom calculado en JS una sola vez */
  transform-origin: top center;
  display:inline-block;
  line-height:0;
}

/* PRODUCTOS PAGE */
.prod-top { padding:12px 20px; flex-shrink:0; border-bottom:1px solid var(--border); background:var(--white); }
.prod-top-title { font-size:15px; font-weight:bold; }
.prod-body { flex:1; min-height:0; overflow-y:auto; padding:14px 20px; }

/* CARD */
.card { background:white; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:12px; }
.card-hdr { padding:9px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; background:var(--panel); }
.card-title { font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
.card-body { padding:12px 14px; }

/* BUTTONS */
.btn { display:inline-flex; align-items:center; gap:5px; padding:6px 13px; border-radius:4px; border:none; font-size:13px; font-weight:bold; font-family:Arial; cursor:pointer; white-space:nowrap; }
.btn-primary { background:var(--accent); color:white; }
.btn-primary:hover { background:#333; }
.btn-success { background:var(--green); color:white; }
.btn-success:hover { background:#155724; }
.btn-ghost { background:transparent; color:var(--text); border:1.5px solid var(--border-dark); }
.btn-ghost:hover { background:var(--bg); }
.btn-sm { padding:4px 9px; font-size:12px; }
.btn-icon { padding:4px 7px; font-size:13px; }

/* FORM */
.field-group { display:flex; flex-direction:column; gap:4px; }
.field-label { font-size:11px; font-weight:bold; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
.field-input, .field-select { border:1.5px solid var(--border-dark); border-radius:4px; padding:7px 10px; font-size:13px; font-family:Arial; background:white; width:100%; }
.field-input:focus, .field-select:focus { outline:none; border-color:var(--accent); }
.field-input::placeholder { color:var(--light); }

/* PRODUCT LIST */
.prod-list { overflow-y:auto; }
.prod-opt { padding:8px 12px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; border-bottom:1px solid var(--border); }
.prod-opt:last-child { border-bottom:none; }
.prod-opt:hover { background:#f0f0f0; }
.prod-opt.sel { background:var(--accent); color:white; }
.prod-opt.sel .prod-ref { color:rgba(255,255,255,.5); }
.prod-opt-name { font-size:13px; font-weight:bold; }
.prod-ref { font-size:11px; color:var(--light); }

/* LOTE */
.lote-grid { display:grid; grid-template-columns:1fr 20px 1fr; gap:6px; align-items:end; }
.lote-arrow { padding-bottom:9px; font-size:15px; color:var(--muted); text-align:center; }
.pc-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.rango-info { background:#cce5ff; color:#004085; border-radius:4px; padding:7px 11px; font-size:12px; font-weight:bold; }

/* TABLE */
.prod-table { width:100%; border-collapse:collapse; }
.prod-table th { background:var(--panel); padding:8px 12px; text-align:left; font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); border-bottom:2px solid var(--border); position:sticky; top:0; }
.prod-table td { padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.prod-table tr:last-child td { border-bottom:none; }
.prod-table tr:hover td { background:#fafafa; }
.prod-table tr.editing td { background:#fffbe8; }
.destino-badge { display:inline-block; font-size:11px; font-weight:bold; padding:2px 8px; border-radius:10px; }
.badge-bc { background:#d1ecf1; color:#0c5460; }
.badge-br { background:#d4edda; color:#155724; }
.badge-mc { background:#e2d9f3; color:#4a235a; }
.badge-mr { background:#fde8d8; color:#7d2e0e; }
.inline-edit { border:1.5px solid var(--border-dark); border-radius:3px; padding:4px 7px; font-size:13px; font-family:Arial; width:100%; }
.inline-edit:focus { outline:none; border-color:var(--accent); }
.add-grid { display:grid; grid-template-columns:2fr 1fr 1fr 80px auto; gap:10px; align-items:end; }
.filtros { display:flex; gap:10px; align-items:flex-end; margin-bottom:12px; flex-wrap:wrap; }
.empty { text-align:center; padding:24px 16px; color:var(--muted); }
.empty .ico { font-size:28px; margin-bottom:6px; }

/* ===== ETIQUETA A4 HORIZONTAL ===== */
.etiqueta {
  width:297mm; height:210mm; background:white;
  padding:30mm 10mm; display:flex; flex-direction:column;
  page-break-after:always; box-shadow:0 4px 24px rgba(0,0,0,.5);
}
.fila-cab { display:grid; grid-template-columns:1fr 1fr; gap:8mm; margin-bottom:3mm; flex-shrink:0; }
.bloque-logo { border:none; padding:4mm 6mm; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
.logo-img { width:55mm; display:block; margin:0 auto; }
.logo-dir { font-size:13pt; line-height:1.5; margin-top:2mm; }
.bloque-temp { border:none; display:flex; align-items:center; justify-content:center; }
.temp-txt { font-size:29pt; font-weight:bold; text-align:center; line-height:1.2; padding:4mm; }
.label-dest { font-size:17pt; margin-bottom:4mm; flex-shrink:0; }
/* fila-dest ocupa el espacio disponible entre cabecera y datos */
.fila-dest { display:grid; grid-template-columns:1fr 1fr; gap:8mm; margin-bottom:3mm; flex:1; min-height:0; }
.fila-dest > div { display:flex; flex-direction:column; }
.bloque-dest { border:none; padding:3mm 5mm; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; flex:1; }
.dest-nombre { font-size:26pt; font-weight:bold; line-height:1.2; }
.dest-dir { font-size:16pt; font-weight:bold; text-align:center; margin-top:1mm; line-height:1.4; white-space:normal; }
.ref-col { display:flex; flex-direction:column; flex:1; }
.ref-lbl-top { font-size:17pt; margin-bottom:2mm; flex-shrink:0; }
.ref-box { border:none; padding:3mm 5mm; display:flex; align-items:center; justify-content:center; flex:1; }
.ref-num { font-size:52pt; font-weight:bold; text-align:center; }

/* DATOS: sabor separado de su campo, luego 3 columnas */
.fila-datos { display:flex; flex-direction:column; gap:0; flex-shrink:0; }
.dato-sabor { display:flex; flex-direction:column; gap:0; margin-bottom:2mm; margin-top:0; }
.dato-sabor .dato-lbl { font-size:18pt; font-weight:bold; margin-bottom:1mm; }
.dato-sabor .dato-val { border:none; width:100%; padding:3mm 4mm; font-size:31pt; font-weight:bold; display:flex; align-items:center; justify-content:flex-start; min-height:18mm; line-height:1.3; flex-wrap:wrap; align-content:center; }
.fila-datos-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4mm; flex-shrink:0; }
.dato-fila { display:flex; align-items:stretch; }
.dato-lbl { font-size:20pt; white-space:nowrap; display:flex; align-items:center; padding-right:2mm; min-width:22mm; }
.dato-val { border:none; flex:1; padding:2mm 3mm; font-size:32pt; font-weight:bold; display:flex; align-items:center; justify-content:flex-start; min-height:14mm; }

@media print {
  html,body { overflow:visible; height:auto; display:block; margin:0; padding:0; }
  nav, #page-etiquetas, #page-productos { display:none !important; }
  #zona-print {
    display:block !important;
    width:297mm;
  }
  .etiqueta {
    display:block !important;
    box-shadow:none;
    width:297mm; height:210mm;
    margin:0; padding:8mm 10mm;
    page-break-after:always;
    break-after:page;
    page-break-inside:avoid;
    break-inside:avoid;
    overflow:hidden;
  }
  /* Todos los hijos de etiqueta como block para evitar conflictos flex */
  .etiqueta * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  @page { size:A4 landscape; margin:0; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">PALETS <span>·</span> framajova</div>
  <div class="nav-tab active" id="tab-etiquetas" onclick="showPage('etiquetas')">🖨 Crear Etiquetas</div>
  <div class="nav-tab" id="tab-productos" onclick="showPage('productos')">📦 Gestión de Productos</div>
</nav>

<!-- ETIQUETAS -->
<div class="page visible" id="page-etiquetas">
  <div class="etq-top">
    <div>
      <div class="etq-top-title">Crear Etiquetas de Palet</div>
      <div class="etq-top-sub">Selecciona destino, producto y rango de lotes</div>
    </div>
    <button class="btn btn-ghost" onclick="limpiar()" style="margin-right:8px">🗑 Limpiar</button><button class="btn btn-primary" onclick="imprimir()">🖨 Imprimir</button>
  </div>
  <div class="etq-body">

    <!-- CONFIG -->
    <div class="config-col">

      <div class="config-section">
        <div class="config-section-title">1 · Destino y temperatura</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="field-group">
            <label class="field-label">Destino</label>
            <select class="field-select" id="etq-destino" onchange="onDestinoChange()">
              <optgroup label="BITES">
                <option value="bites_cheste">BITES → CHESTE</option>
                <option value="bites_ribarroja">BITES → RIBARROJA</option>
              </optgroup>
              <optgroup label="MOCHI">
                <option value="mochi_cheste">MOCHI → CHESTE</option>
                <option value="mochi_ribarroja">MOCHI → RIBARROJA</option>
              </optgroup>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Temperatura</label>
            <select class="field-select" id="etq-temp" onchange="preview()">
              <option value="PRODUCTO REFRIGERADO">PRODUCTO REFRIGERADO</option>
              <option value="PRODUCTO Tª AMBIENTE">PRODUCTO Tª AMBIENTE</option>
              <option value="PRODUCTO TEMPERATURA AMBIENTE">PRODUCTO TEMPERATURA AMBIENTE</option>
            </select>
          </div>
        </div>
      </div>

      <div class="config-section" style="padding:0;flex:1;min-height:0;display:flex;flex-direction:column;">
        <div style="padding:10px 14px 7px;border-bottom:1px solid var(--border);flex-shrink:0">
          <div class="config-section-title" style="margin:0">2 · Producto</div>
        </div>
        <div class="prod-list" id="prod-lista" style="flex:1;overflow-y:auto"></div>
      </div>

      <div class="config-section">
        <div class="config-section-title">3 · Lote, peso y cajas</div>
        <div style="display:flex;flex-direction:column;gap:11px">
          <div>
            <div class="field-label" style="margin-bottom:5px">Rango de lotes</div>
            <div class="lote-grid">
              <div class="field-group">
                <label class="field-label">Inicio</label>
                <input class="field-input" id="etq-lote-ini" placeholder="Ej: 120526-B1" oninput="preview()">
              </div>
              <div class="lote-arrow">→</div>
              <div class="field-group">
                <label class="field-label">Fin</label>
                <input class="field-input" id="etq-lote-fin" placeholder="Ej: 120526-B7" oninput="preview()">
              </div>
            </div>
          </div>
          <div class="pc-grid">
            <div class="field-group">
              <label class="field-label">Peso</label>
              <input class="field-input" id="etq-peso" placeholder="Ej: 439,860 kg" oninput="preview()">
            </div>
            <div class="field-group">
              <label class="field-label">Nº Cajas</label>
              <input class="field-input" id="etq-cajas" value="1" oninput="preview()">
            </div>
          </div>
          <div id="etq-rango-info" class="rango-info" style="display:none"></div>
        </div>
      </div>

    </div>

    <!-- PREVIEW -->
    <div class="preview-col" id="preview-col">
      <div class="preview-zoom-wrap" id="preview-zoom">
        <div class="etiqueta" id="etq-prev"></div>
      </div>
    </div>
  </div>
</div>

<!-- PRODUCTOS -->
<div class="page" id="page-productos">
  <div class="prod-top"><div class="prod-top-title">Gestión de Productos</div></div>
  <div class="prod-body">
    <div class="card">
      <div class="card-hdr"><span class="card-title">➕ Nuevo producto</span></div>
      <div class="card-body">
        <div class="add-grid">
          <div class="field-group">
            <label class="field-label">Nombre</label>
            <input class="field-input" id="np-nombre" placeholder="Ej: BROWNIE RA MB" onkeydown="if(event.key==='Enter')addProducto()">
          </div>
          <div class="field-group">
            <label class="field-label">REF. ESTIU</label>
            <input class="field-input" id="np-ref" placeholder="309080">
          </div>
          <div class="field-group">
            <label class="field-label">Destino</label>
            <select class="field-select" id="np-destino">
              <option value="bites_cheste">BITES → CHESTE</option>
              <option value="bites_ribarroja">BITES → RIBARROJA</option>
              <option value="mochi_cheste">MOCHI → CHESTE</option>
              <option value="mochi_ribarroja">MOCHI → RIBARROJA</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Color REF</label>
            <input type="color" id="np-color" value="#ffffff" style="width:100%;height:36px;border:1.5px solid var(--border-dark);border-radius:4px;padding:2px;cursor:pointer">
          </div>
          <button class="btn btn-success" onclick="addProducto()">➕ Añadir</button>
        </div>
      </div>
    </div>
    <div class="filtros">
      <div class="field-group">
        <label class="field-label">Filtrar destino</label>
        <select class="field-select" id="filtro-dest" onchange="renderProductos()">
          <option value="">Todos</option>
          <option value="bites_cheste">BITES → CHESTE</option>
          <option value="bites_ribarroja">BITES → RIBARROJA</option>
          <option value="mochi_cheste">MOCHI → CHESTE</option>
          <option value="mochi_ribarroja">MOCHI → RIBARROJA</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Buscar</label>
        <input class="field-input" id="filtro-q" placeholder="Buscar..." oninput="renderProductos()" style="min-width:180px">
      </div>
      <div style="align-self:flex-end;padding-bottom:2px">
        <span id="prod-count" style="font-size:12px;color:var(--muted)"></span>
      </div>
    </div>
    <div class="card" style="margin-bottom:0">
      <table class="prod-table">
        <thead><tr>
          <th>#</th><th>Nombre</th><th>REF. ESTIU</th><th>Destino</th><th style="width:60px;text-align:center">Color</th>
          <th style="width:130px;text-align:center">Acciones</th>
        </tr></thead>
        <tbody id="prod-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ZONA PRINT -->
<div id="zona-print" style="display:none"></div>

function showPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('visible'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('visible');
  document.getElementById('tab-'+p).classList.add('active');
  if (p==='productos') renderProductos();
  if (p==='etiquetas') scalePreview();
}

function scalePreview() {
  const col  = document.getElementById('preview-col');
  const wrap = document.getElementById('preview-zoom');
  if (!col || !wrap) return;
  const availW = col.clientWidth  - 32;
  const availH = col.clientHeight - 32;
  // A4 landscape in px at 96dpi: 297mm * 3.7795 = 1122px, 210mm * 3.7795 = 794px
  const etqW = 1122, etqH = 794;
  const sc = Math.min(availW / etqW, availH / etqH, 1).toFixed(4);
  wrap.style.transform = 'scale(' + sc + ')';
  wrap.style.transformOrigin = 'top center';
  wrap.style.width  = etqW + 'px';
  wrap.style.height = etqH + 'px';
  // Adjust col height to avoid scrollbar from transform overflow
  col.style.height = (etqH * sc + 32) + 'px';
}
window.addEventListener('resize', scalePreview);

function getLotes() {
  const ini = document.getElementById('etq-lote-ini').value.trim();
  const fin = document.getElementById('etq-lote-fin').value.trim();
  if (!ini) return [];
  if (!fin || fin === ini) return [ini];

  function split(s) {
    const dash = s.lastIndexOf('-');
    if (dash === -1) {
      const m = s.match(/^([a-zA-Z]*)([0-9]+)$/);
      return m ? { pre: m[1], num: parseInt(m[2], 10) } : null;
    }
    const after = s.slice(dash + 1);
    const m = after.match(/^([a-zA-Z]*)([0-9]+)$/);
    if (!m) return null;
    return { pre: s.slice(0, dash + 1) + m[1], num: parseInt(m[2], 10) };
  }

  const pIni = split(ini);
  const pFin = split(fin);

  if (!pIni || !pFin || pIni.pre !== pFin.pre) return [ini, fin];

  const lotes = [];
  const lo = Math.min(pIni.num, pFin.num);
  const hi = Math.max(pIni.num, pFin.num);
  for (let n = lo; n <= hi; n++)
    lotes.push(pIni.pre + n);
  return lotes;
}


function contrastColor(hex) {
  if (!hex || hex.length < 7) return '#000000';
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 > 128 ? '#000000' : '#ffffff';
}

    <div class="fila-datos">
      <div class="dato-sabor">
        <div class="dato-lbl">SABOR:</div>
        <div class="dato-val">${prod ? prod.n : ''}</div>
      </div>
      <div class="fila-datos-3">
        <div class="dato-fila"><div class="dato-lbl">LOTE:</div><div class="dato-val">${lote}</div></div>
        <div class="dato-fila"><div class="dato-lbl">PESO:</div><div class="dato-val">${peso}</div></div>
        <div class="dato-fila"><div class="dato-lbl">CAJAS:</div><div class="dato-val">${cajas}</div></div>
      </div>
    </div>`;
}

function preview() {
  const dest  = document.getElementById('etq-destino').value;
  const temp  = document.getElementById('etq-temp').value;
  const peso  = document.getElementById('etq-peso').value.trim();
  const cajas = document.getElementById('etq-cajas').value.trim();
  const prod  = productos.find(p => p.id===selId);
  const lotes = getLotes();
  const infoEl = document.getElementById('etq-rango-info');
  if (lotes.length > 1) {
    infoEl.style.display='block';
    infoEl.textContent=`🖨 Se imprimirán ${lotes.length} etiquetas (del ${lotes[0]} al ${lotes[lotes.length-1]})`;
  } else if (lotes.length===1) {
    infoEl.style.display='block';
    infoEl.textContent=`🖨 Se imprimirá 1 etiqueta (lote: ${lotes[0]})`;
  } else {
    infoEl.style.display='none';
  }
  document.getElementById('etq-prev').innerHTML = etiquetaHtml(prod, dest, temp, lotes[0]||'', peso, cajas);
}

function imprimir() {
  const dest  = document.getElementById('etq-destino').value;
  const temp  = document.getElementById('etq-temp').value;
  const peso  = document.getElementById('etq-peso').value.trim();
  const cajas = document.getElementById('etq-cajas').value.trim();
  const prod  = productos.find(p => p.id===selId);
  const lotes = getLotes();
  if (!prod)         { alert('Selecciona un producto.'); return; }
  if (!lotes.length) { alert('Introduce el lote de inicio.'); return; }

  // Construir HTML completo para ventana de impresión
  const etiquetas = lotes.map(l =>
    `<div class="etiqueta">${etiquetaHtml(prod,dest,temp,l,peso,cajas)}</div>`
  ).join('');

  const printHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:white; font-family:Arial,Helvetica,sans-serif; }
@page { size:A4 landscape; margin:0; }
.etiqueta {
  width:297mm; height:210mm; background:white;
  padding:30mm 10mm; display:flex; flex-direction:column;
  page-break-after:always; break-after:page;
  page-break-inside:avoid; break-inside:avoid;
  overflow:hidden;
}
.etiqueta:last-child { page-break-after:auto; break-after:auto; }
.fila-cab { display:grid; grid-template-columns:1fr 1fr; gap:8mm; margin-bottom:3mm; flex-shrink:0; }
.bloque-logo { padding:4mm 6mm; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
.logo-img { width:55mm; display:block; margin:0 auto; }
.logo-dir { font-size:13pt; line-height:1.5; margin-top:2mm; text-align:center; }
.bloque-temp { display:flex; align-items:center; justify-content:center; }
.temp-txt { font-size:29pt; font-weight:bold; text-align:center; line-height:1.2; padding:4mm; }
.label-dest { font-size:17pt; margin-bottom:4mm; flex-shrink:0; }
.fila-dest { display:grid; grid-template-columns:1fr 1fr; gap:8mm; margin-bottom:3mm; flex:1; min-height:0; }
.fila-dest > div { display:flex; flex-direction:column; }
.bloque-dest { border:none; padding:3mm 5mm; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; flex:1; }
.dest-nombre { font-size:26pt; font-weight:bold; line-height:1.2; }
.dest-dir { font-size:16pt; font-weight:bold; text-align:center; margin-top:1mm; line-height:1.4; }
.ref-col { display:flex; flex-direction:column; flex:1; }
.ref-box { border:none; padding:3mm 5mm; display:flex; align-items:center; justify-content:center; flex:1; }
.ref-num { font-size:52pt; font-weight:bold; text-align:center; }
.fila-datos { display:flex; flex-direction:column; gap:0; flex-shrink:0; }
.dato-sabor { display:flex; flex-direction:column; gap:0; margin-bottom:2mm; margin-top:0; }
.dato-sabor .dato-lbl { font-size:18pt; font-weight:bold; margin-bottom:1mm; }
.dato-sabor .dato-val { width:100%; padding:3mm 4mm; font-size:31pt; font-weight:bold; display:flex; align-items:center; justify-content:flex-start; min-height:18mm; line-height:1.3; }
.fila-datos-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4mm; flex-shrink:0; }
.dato-fila { display:flex; align-items:stretch; }
.dato-lbl { font-size:20pt; white-space:nowrap; display:flex; align-items:center; padding-right:2mm; min-width:22mm; }
.dato-val { flex:1; padding:2mm 3mm; font-size:32pt; font-weight:bold; display:flex; align-items:center; justify-content:flex-start; min-height:14mm; }
</style></head><body>${etiquetas}</body></html>`;

  const win = window.open('', '_blank', 'width=1200,height=800');
  win.document.write(printHtml);
  win.document.close();
  win.onload = function() {
    win.focus();
    win.print();
  };
}

function limpiar() {
  document.getElementById('etq-lote-ini').value = '';
  document.getElementById('etq-lote-fin').value = '';
  document.getElementById('etq-peso').value = '';
  document.getElementById('etq-cajas').value = '1';
  document.getElementById('etq-rango-info').style.display = 'none';
  selId = null;
  document.getElementById('etq-destino').selectedIndex = 0;
  onDestinoChange();
}

// PRODUCTOS
function renderProductos() {
  const filtD = document.getElementById('filtro-dest').value;
  const filtQ = document.getElementById('filtro-q').value.toLowerCase();
  let lista = productos;
  if (filtD) lista = lista.filter(p=>p.d===filtD);
  if (filtQ) lista = lista.filter(p=>p.n.toLowerCase().includes(filtQ)||p.r.includes(filtQ));
  document.getElementById('prod-count').textContent = lista.length+' producto'+(lista.length!==1?'s':'');
  const tbody = document.getElementById('prod-tbody');
  if (!lista.length) { tbody.innerHTML=`<tr><td colspan="5"><div class="empty"><div class="ico">🔍</div><p>Sin resultados</p></div></td></tr>`; return; }
  tbody.innerHTML = lista.map((p,i) => {
    const di = DESTS[p.d];
    if (editId===p.id) return `<tr style="background:#fffbe8">
      <td style="color:var(--muted);font-size:12px">${i+1}</td>
      <td><input class="inline-edit" id="e-n" value="${p.n}"></td>
      <td><input class="inline-edit" id="e-r" value="${p.r}" style="width:90px"></td>
      <td><select class="inline-edit" id="e-d" style="width:160px">
        ${Object.entries(DESTS).map(([k,v])=>`<option value="${k}" ${k===p.d?'selected':''}>${v.label}</option>`).join('')}
      </select></td>
      <td style="text-align:center"><input type="color" id="e-c" value="${p.c||'#ffffff'}" style="width:36px;height:28px;border:1px solid #ccc;border-radius:4px;padding:1px;cursor:pointer"></td>
      <td style="text-align:center;white-space:nowrap">
        <button class="btn btn-success btn-sm" onclick="saveEdit(${p.id})">✓</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelEdit()">✕</button>
      </td></tr>`;
    return `<tr>
      <td style="color:var(--muted);font-size:12px">${i+1}</td>
      <td style="font-weight:bold">${p.n}</td>
      <td style="font-family:monospace">${p.r||'<span style="color:var(--muted)">—</span>'}</td>
      <td><span class="destino-badge ${di.badge}">${di.label}</span></td>
      <td style="text-align:center"><div style="width:28px;height:28px;border-radius:4px;background:${p.c||'#ffffff'};border:1px solid #ccc;margin:auto"></div></td>
      <td style="text-align:center;white-space:nowrap">
        <button class="btn btn-ghost btn-sm btn-icon" title="Editar"   onclick="startEdit(${p.id})">✏️</button>
        <button class="btn btn-ghost btn-sm btn-icon" title="Duplicar" onclick="dupProd(${p.id})">📋</button>
        <button class="btn btn-ghost btn-sm btn-icon" title="Eliminar" onclick="delProd(${p.id})">🗑️</button>
      </td></tr>`;
  }).join('');
}

function addProducto() {
  const n = document.getElementById('np-nombre').value.trim();
  if (!n) { document.getElementById('np-nombre').focus(); return; }
  productos.push({id:nextId++, d:document.getElementById('np-destino').value, n:n.toUpperCase(), r:document.getElementById('np-ref').value.trim(), c:document.getElementById('np-color').value});
  document.getElementById('np-nombre').value='';
  document.getElementById('np-ref').value='';
  renderProductos();
}
function startEdit(id) { editId=id; renderProductos(); }
function cancelEdit()  { editId=null; renderProductos(); }
function saveEdit(id) {
  const p=productos.find(x=>x.id===id);
  p.n=document.getElementById('e-n').value.trim().toUpperCase();
  p.r=document.getElementById('e-r').value.trim();
  p.d=document.getElementById('e-d').value;
  p.c=document.getElementById('e-c').value;
  editId=null; renderProductos(); renderProdLista();
}
function dupProd(id) {
  const p=productos.find(x=>x.id===id);
  productos.push({id:nextId++,d:p.d,n:p.n+' (copia)',r:p.r,c:p.c||'#ffffff'});
  renderProductos(); renderProdLista();
}
function delProd(id) {
  if(!confirm('¿Eliminar este producto?')) return;
  productos=productos.filter(p=>p.id!==id);
  if(selId===id){selId=null;preview();}
  renderProductos(); renderProdLista();
}

// INIT
renderProdLista();
preview();
// Escalar preview después de que el DOM esté pintado
requestAnimationFrame(() => { requestAnimationFrame(scalePreview); });
</script>
</body>
</html>
